<!DOCTYPE html>
<html>
<head>
<title>Fashion Suggestion Robot Payment</title>

<style>
body{
    font-family:Arial;
    text-align:center;
    background:#f5f5f5;
    margin-top:80px;
}

.box{
    background:white;
    width:350px;
    margin:auto;
    padding:30px;
    border-radius:15px;
    box-shadow:0 0 10px #ccc;
}

button{
    background:green;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    cursor:pointer;
}

#success{
    display:none;
    color:green;
    margin-top:20px;
}
</style>
</head>

<body>

<div class="box">

<h2>Fashion Suggestion Robot</h2>

<h3>Payment Amount</h3>

<h1>₹20,000</h1>

<button onclick="confirmPayment()">
Confirm Payment
</button>

<div id="success">
<h1>✅</h1>
<h2>Payment Confirmed</h2>
</div>

</div>

<script>
function confirmPayment(){

    document.getElementById("success").style.display="block";

    // Database save API call here
    // fetch('/save-payment', {method:'POST'})
}
</script>

</body>
</html>
