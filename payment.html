<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Payment</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    margin:0;
}
.box{
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
    width:320px;
    text-align:center;
}
h2{
    color:#0d6efd;
}
p{
    font-size:18px;
}
button{
    background:#0d6efd;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:8px;
    font-size:18px;
    cursor:pointer;
}
button:hover{
    background:#084298;
}
#success{
    display:none;
    color:green;
    font-size:22px;
    margin-top:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="box">
    <h2>Robot Booking</h2>

    <p><b>Robot Name:</b> <span id="robot"></span></p>
    <p><b>Price:</b> ₹<span id="price"></span></p>

    <button onclick="payNow()">Continue</button>

    <div id="success">
        ✅ Payment Successful
    </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);

document.getElementById("robot").innerText =
params.get("robot") || "Robot";

document.getElementById("price").innerText =
params.get("price") || "0";

function payNow(){
    document.getElementById("success").style.display="block";
}
</script>

</body>
</html>
